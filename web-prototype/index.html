<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar Smash 3D</title><style>body{margin:0;background:#020617;color:#fff;font:14px Arial}#ui{position:fixed;left:12px;top:12px;width:300px;background:#0f172acc;padding:14px;border-radius:14px}button{margin:4px;padding:8px 10px;border:0;border-radius:8px;background:#2563eb;color:#fff}canvas{display:block}.muted{color:#94a3b8;font-size:12px}</style><div id=ui><h3>Solar Smash 3D</h3><div><button id=planetBtn>Planet</button><button id=solarBtn>Solar</button><button id=resetBtn>Reset</button></div><div><button data-w=meteor>Meteor</button><button data-w=laser>Laser</button><button data-w=missile>Missile</button></div><p id=stat></p><p class=muted>클릭으로 크레이터를 남기고 누적 데미지를 확인합니다.</p></div><canvas id=c></canvas><script>const c=document.getElementById("c"),x=c.getContext("2d"),stat=document.getElementById("stat");let mode="planet",weapon="meteor",hits=[],damage=0;function rs(){c.width=innerWidth;c.height=innerHeight}function drawBody(t,i){let cx=c.width*.68,cy=c.height*.54,r=Math.min(c.width,c.height)*(i?0.06:0.14);if(mode==="solar"&&i){cx+=Math.cos(t/800+i)*150;cy+=Math.sin(t/900+i)*90}x.beginPath();x.fillStyle=i?"#38bdf8":"#f97316";x.arc(cx,cy,r,0,7);x.fill();hits.forEach(h=>{if(Math.hypot(h.x-cx,h.y-cy)<r+h.s){x.fillStyle="rgba(15,23,42,.8)";x.beginPath();x.arc(h.x,h.y,h.s*.7,0,7);x.fill();x.fillStyle="rgba(251,146,60,.6)";x.beginPath();x.arc(h.x,h.y,h.s*.35,0,7);x.fill()}})}function loop(t){x.fillStyle="#020617";x.fillRect(0,0,c.width,c.height);for(let i=0;i<80;i++)x.fillRect((i*131)%c.width,(i*67)%c.height,2,2);drawBody(t,0);if(mode==="solar"){drawBody(t,1);drawBody(t,2)}stat.textContent="Mode "+mode+" · Weapon "+weapon+" · Damage "+damage;requestAnimationFrame(loop)}c.onclick=e=>{const b=c.getBoundingClientRect(),s=weapon==="laser"?10:weapon==="missile"?26:18;hits.push({x:e.clientX-b.left,y:e.clientY-b.top,s:s});damage+=s};planetBtn.onclick=()=>mode="planet";solarBtn.onclick=()=>mode="solar";resetBtn.onclick=()=>{hits=[];damage=0};document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>weapon=b.dataset.w);onresize=rs;rs();requestAnimationFrame(loop);</script>
